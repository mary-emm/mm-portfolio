#setting up quarto website, and pages to be rendered from docs
project:
  type: website 
  output-dir: docs
  resources:
    - projects/audio-seal/*.pdf
    - projects/flip-7/*.pdf

execute:
  freeze: auto

website: 
  title: "Maryam Al-Faiz"
  navbar:
    background: "#70020f"   

    logo: images/logo.png      
    logo-alt: "Logo"           
    logo-href: index.qmd       #
    right:
      - icon: github
        href: https://github.com/mary-emm/mm-portfolio
        aria-label: GitHub
        target: _blank
      - icon: envelope
        href: mailto:maryamalfaiz06@gmail.com
        aria-label: Email
    
  sidebar:
    style: docked
    contents: 
      - href: index.qmd
        text: About
      - section: "Past Projects"
        contents:
        
          - href: projects/flip-7/flip-7.qmd
            text: "[Personal] Flip-7"
        
          - href: projects/cyber-quest/cyber-quest.qmd
            text: "CyberQuest: MY Edition"

          - href: projects/nafas/nafas.qmd
            text: "NAFAS: Streamlit app"

          - href: projects/audio-seal/audio-seal.qmd
            text: "AudioSeal"


format:
  html:
    code-copy: true
    theme: [darkly, custom.scss]
    css: styles.css
