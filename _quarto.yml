#setting up quarto website, and pages to be rendered from docs
project:
  type: website 
  output-dir: docs
  resources:
    - projects/audio-seal/*.pdf
    - projects/flip-7/*.pdf

execute:
  freeze: auto

website: 
  title: "Maryam Al-Faiz"
  favicon: images/logo.png
  navbar:
    title: "MARYAM AL-FAIZ<span class='name-bar'></span>"
    right:
      - text: about
        href: about.qmd
      - text: projects
        href: projects.qmd
      - text: contact
        href: contact.qmd
      - icon: github
        href: https://github.com/mary-emm/mm-portfolio
        aria-label: GitHub
        target: _blank

format:
  html:
    theme:
      light: [litera, assets/mm-theme-light.scss]
      dark: [darkly, assets/mm-theme-dark.scss]
    css: assets/mm-styles.css
    code-copy: true
    code-block-border-left: true
    smooth-scroll: true
    link-external-newwindow: true
